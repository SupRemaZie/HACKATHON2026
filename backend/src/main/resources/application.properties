spring.application.name=hackathon

# --- PostgreSQL (valeurs injectées par docker-compose via variables d'env) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carbon_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:carbon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:carbon}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Actuator (healthcheck docker-compose) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
