spring.application.name=hackathon

# --- PostgreSQL (valeurs injectées par docker-compose via variables d'env) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carbon_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:carbon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:carbon}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- ADEME Base Carbone ---
ademe.base-url=https://data.ademe.fr/data-fair/api/v1/datasets/base-carbone

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- JWT ---
jwt.secret=${JWT_SECRET:h4ck4th0n2026_s3cr3t_k3y_ch4ng3_m3!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Actuator (healthcheck docker-compose) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# --- Springdoc OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.show-common-extensions=true
